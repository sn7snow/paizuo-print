# ============================================================
# 排座系统 · nginx 站点配置【纯 HTTP 版】
#
# 用于还没上 HTTPS 的服务器：只监听 80，无证书依赖。
# 上了 HTTPS 请改用 nginx-tls.conf（deploy.sh --tls 会自动切换）。
#
# 放置位置（Debian/Ubuntu）：
#   1. 复制本文件为 /etc/nginx/sites-available/paizuo
#   2. sudo ln -s /etc/nginx/sites-available/paizuo /etc/nginx/sites-enabled/
#   3. 移除默认站点软链（如仍存在）：sudo rm /etc/nginx/sites-enabled/default
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 依赖：
#   · /etc/nginx/snippets/paizuo-locations.conf（location 合集，deploy.sh 会一起装）
#   · node 服务以 SOCKET_PATH=/run/paizuo/paizuo.sock 启动，不占任何 TCP 端口
# ============================================================

server {
    listen 80 default_server;
    # 若系统禁用了 IPv6 导致 nginx 起不来，删掉下面这行
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    client_max_body_size 8m;      # 名单/排座数据导入够用，超限直接 413
    server_tokens off;            # 不回显 nginx 版本号

    include /etc/nginx/snippets/paizuo-locations.conf;
}
