# ============================================================
# 排座系统 · nginx 站点配置【HTTPS 版】
#
# 80 → 301 跳 https，443 提供服务；证书由 make-cert.sh 生成并放在
# /etc/nginx/ssl/（deploy.sh --tls 会自动调用 make-cert.sh）。
#
# 放置位置：/etc/nginx/sites-available/paizuo（deploy.sh --tls 自动装）
#
# 依赖：
#   · /etc/nginx/ssl/paizuo-chain.crt   （服务器证书 + 根证书拼接）
#   · /etc/nginx/ssl/paizuo.key
#   · /etc/nginx/snippets/paizuo-locations.conf
#   · node 服务以 SOCKET_PATH=/run/paizuo/paizuo.sock 启动
#
# 想在 80 上继续提供明文页面（不跳转）？把下面的 301 那行换成：
#   include /etc/nginx/snippets/paizuo-locations.conf;
# ============================================================

# ---------- 80：一律跳转 HTTPS ----------
server {
    listen 80 default_server;
    # 若系统禁用了 IPv6 导致 nginx 起不来，删掉下面这行
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ---------- 443：正式服务 ----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    client_max_body_size 8m;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/paizuo-chain.crt;
    ssl_certificate_key /etc/nginx/ssl/paizuo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/paizuo-locations.conf;
}
