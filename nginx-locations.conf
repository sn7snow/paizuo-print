# ============================================================
# 排座系统 · 公共 location 片段
#
# 由 nginx-site.conf（纯 80）和 nginx-tls.conf（80 跳转 + 443）在 server{} 内
# include 使用，只写一份，避免两套配置各改一遍。
#
# 安装位置：/etc/nginx/snippets/paizuo-locations.conf
# 依赖 server 块提供：root /var/www/html、index、client_max_body_size
# ============================================================

# 静态页面（login.html / index.html / huiyi.html / print-zhuoqian.html）
location / {
    try_files $uri $uri/ =404;
}

# API 全部反代到 node 服务（server.js）——走 Unix socket，不经 TCP 端口。
# 注意：proxy_pass 末尾不要加 ":/"，否则会把 /api/ 前缀剥掉，接口全 404。
location /api/ {
    proxy_pass http://unix:/run/paizuo/paizuo.sock;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
}

# ---- 以下内容绝不允许被静态直读（数据 / 凭据 / 配置 / 源码）----
location ^~ /data/               { return 404; }
location = /credentials.txt      { return 404; }
location = /server.js            { return 404; }
location = /nginx.conf           { return 404; }
location = /nginx-site.conf      { return 404; }
location = /nginx-tls.conf       { return 404; }
location = /nginx-locations.conf { return 404; }
location = /make-cert.sh         { return 404; }
location = /deploy.sh            { return 404; }
location = /auth.json            { return 404; }
